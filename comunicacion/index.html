<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicación UAS — Ministerio del Interior</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-primary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <strong>Comunicación UAS</strong>
      <small class="d-none d-sm-inline text-white-50 ms-2">Ministerio del Interior — V9.0</small>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#" data-nav="comunicacion">Comunicación</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Datos</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-nav="personas">Personas</a></li>
            <li><a class="dropdown-item" href="#" data-nav="drones">Drones</a></li>
            <li><a class="dropdown-item" href="#" data-nav="operaciones">Operaciones</a></li>
          </ul>
        </li>
      </ul>
      <div class="d-flex flex-wrap gap-2">
        <label class="btn btn-outline-light btn-sm">
          Cargar YAML
          <input type="file" id="fileInput" accept=".yaml,.yml" hidden>
        </label>
        <button class="btn btn-outline-light btn-sm" id="btnExportYaml">Exportar YAML</button>
        <button class="btn btn-warning btn-sm fw-semibold" id="btnGenerar">Generar</button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- ============ Comunicación ============ -->
  <section class="app-section" id="section-comunicacion">

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Operación</h5>
        <div class="row g-3">
          <div class="col-12">
            <label for="com-operacion" class="form-label">Operación</label>
            <select id="com-operacion" class="form-select"></select>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Operador</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="com-operador" class="form-label">Operador</label>
            <select id="com-operador" class="form-select"></select>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="com-notificacion" checked>
              <label class="form-check-label" for="com-notificacion">Notificación por email</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Fechas</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="com-fecha-hora" class="form-label">Fecha/hora comunicación</label>
            <input type="text" class="form-control" id="com-fecha-hora" placeholder="27/02/2026 10:00">
          </div>
          <div class="col-md-6">
            <label for="com-fecha-operacion" class="form-label">Fecha operación (override)</label>
            <input type="text" class="form-control" id="com-fecha-operacion" placeholder="Vacío = usar la de la operación">
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Roles</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <h6>Pilotos</h6>
            <div class="btn-group btn-group-sm mb-2">
              <button class="btn btn-outline-secondary" id="pilotos-all">Todos</button>
              <button class="btn btn-outline-secondary" id="pilotos-none">Ninguno</button>
            </div>
            <div id="pilotos-list" class="checkbox-list"></div>
          </div>
          <div class="col-md-6">
            <h6>Drones</h6>
            <div class="btn-group btn-group-sm mb-2">
              <button class="btn btn-outline-secondary" id="drones-sel-all">Todos</button>
              <button class="btn btn-outline-secondary" id="drones-sel-none">Ninguno</button>
            </div>
            <div id="drones-sel-list" class="checkbox-list"></div>
          </div>
        </div>
        <div class="row g-3 mt-1">
          <div class="col-12">
            <h6>Observador</h6>
            <select id="com-observador" class="form-select"></select>
          </div>
        </div>
        <div class="alert alert-light mt-3 mb-0 py-2" id="combo-summary"></div>
        <button class="btn btn-primary mt-2" id="btnGenerarMain">Generar</button>
      </div>
    </div>

  </section>

  <!-- ============ Personas ============ -->
  <section class="app-section d-none" id="section-personas">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Personas</h4>
      <button class="btn btn-primary btn-sm" id="btnAddPersona">+ Añadir persona</button>
    </div>
    <div class="accordion" id="personas-list"></div>
  </section>

  <!-- ============ Drones ============ -->
  <section class="app-section d-none" id="section-drones">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Drones (UAS)</h4>
      <button class="btn btn-primary btn-sm" id="btnAddDrone">+ Añadir dron</button>
    </div>
    <div class="accordion" id="drones-list"></div>
  </section>

  <!-- ============ Operaciones ============ -->
  <section class="app-section d-none" id="section-operaciones">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Operaciones</h4>
      <button class="btn btn-primary btn-sm" id="btnAddOperacion">+ Añadir operación</button>
    </div>
    <div class="accordion" id="operaciones-list"></div>
  </section>

</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="toast" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
