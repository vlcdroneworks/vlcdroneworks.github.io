<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicación UAS — Valencia Drone Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vdw: {
              navy: '#1E2A3A',
              'navy-light': '#2A3A4A',
              orange: '#E8914A',
              blue: '#7FB3D5',
            }
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-vdw-navy min-h-screen font-sans text-white">

<!-- Loading overlay -->
<div id="loading-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center" style="display:none">
  <div class="bg-vdw-navy-light border border-white/10 rounded-2xl p-8 flex flex-col items-center gap-3 shadow-2xl">
    <div class="spinner"></div>
    <span class="text-white/70 text-sm">Generando documentos...</span>
  </div>
</div>

<!-- Navbar -->
<nav class="sticky top-0 z-50 bg-vdw-navy/95 backdrop-blur-md border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex items-center justify-between h-14">
      <a href="#" class="flex items-center gap-2">
        <img src="logo-2.png" alt="VDW" class="w-7 h-7">
        <span class="font-bold text-white">Comunicación UAS</span>
        <span class="hidden sm:inline text-white/40 text-xs">V9.0</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-4">
        <div class="flex items-center gap-1">
          <a href="#" data-nav="comunicacion" class="nav-tab active">Comunicación</a>
          <div class="relative" id="datos-dropdown-wrapper">
            <button class="nav-tab" id="datos-toggle">
              Datos
              <svg class="w-3.5 h-3.5 ml-0.5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div class="dropdown-panel hidden" id="datos-menu">
              <a href="#" data-nav="personas" class="dropdown-link">Personas <span class="nav-count" id="count-personas"></span></a>
              <a href="#" data-nav="drones" class="dropdown-link">Drones <span class="nav-count" id="count-drones"></span></a>
              <a href="#" data-nav="operaciones" class="dropdown-link">Operaciones <span class="nav-count" id="count-operaciones"></span></a>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <label class="btn-ghost cursor-pointer text-sm">
            Cargar YAML
            <input type="file" id="fileInput" accept=".yaml,.yml" hidden>
          </label>
          <button class="btn-ghost text-sm" id="btnExportYaml">Exportar YAML</button>
          <button class="btn-primary text-sm" id="btnGenerar">Generar</button>
        </div>
      </div>

      <!-- Mobile toggle -->
      <button class="md:hidden text-white/70 hover:text-white p-1" id="mobile-toggle">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div class="hidden md:hidden pb-4 border-t border-white/10 mt-2 pt-3 space-y-1" id="mobile-menu">
      <a href="#" data-nav="comunicacion" class="mobile-link active">Comunicación</a>
      <a href="#" data-nav="personas" class="mobile-link">Personas <span class="nav-count" id="count-personas-m"></span></a>
      <a href="#" data-nav="drones" class="mobile-link">Drones <span class="nav-count" id="count-drones-m"></span></a>
      <a href="#" data-nav="operaciones" class="mobile-link">Operaciones <span class="nav-count" id="count-operaciones-m"></span></a>
      <div class="flex flex-wrap gap-2 pt-3 mt-2 border-t border-white/10">
        <label class="btn-ghost cursor-pointer text-sm">
          Cargar YAML
          <input type="file" class="mobile-file-input" accept=".yaml,.yml" hidden>
        </label>
        <button class="btn-ghost text-sm mobile-export-btn">Exportar</button>
        <button class="btn-primary text-sm mobile-generate-btn">Generar</button>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">

  <!-- ============ Comunicación ============ -->
  <section class="app-section" id="section-comunicacion">

    <div class="vdw-card">
      <h5 class="card-title">Operación</h5>
      <div>
        <label class="field-label" for="com-operacion">Operación</label>
        <select id="com-operacion" class="field-select"></select>
      </div>
    </div>

    <div class="vdw-card">
      <h5 class="card-title">Operador</h5>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="field-label" for="com-operador">Operador</label>
          <select id="com-operador" class="field-select"></select>
        </div>
        <div class="flex items-end">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="com-notificacion" checked class="cb-native">
            <span class="text-white/70 text-sm">Notificación por email</span>
          </label>
        </div>
      </div>
    </div>

    <div class="vdw-card">
      <h5 class="card-title">Fechas</h5>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="field-label" for="com-fecha-hora">Fecha/hora comunicación</label>
          <input type="text" class="field-input" id="com-fecha-hora" placeholder="27/02/2026 10:00">
        </div>
        <div>
          <label class="field-label" for="com-fecha-operacion">Fecha operación (override)</label>
          <input type="text" class="field-input" id="com-fecha-operacion" placeholder="Vacío = usar la de la operación">
        </div>
      </div>
    </div>

    <div class="vdw-card">
      <h5 class="card-title">Roles</h5>
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <h6 class="text-sm font-semibold text-white/80 mb-2">Pilotos</h6>
          <div class="flex gap-1.5 mb-2">
            <button class="btn-sm" id="pilotos-all">Todos</button>
            <button class="btn-sm" id="pilotos-none">Ninguno</button>
          </div>
          <div id="pilotos-list" class="checkbox-list"></div>
        </div>
        <div>
          <h6 class="text-sm font-semibold text-white/80 mb-2">Drones</h6>
          <div class="flex gap-1.5 mb-2">
            <button class="btn-sm" id="drones-sel-all">Todos</button>
            <button class="btn-sm" id="drones-sel-none">Ninguno</button>
          </div>
          <div id="drones-sel-list" class="checkbox-list"></div>
        </div>
      </div>
      <div class="mt-5">
        <h6 class="text-sm font-semibold text-white/80 mb-2">Observador</h6>
        <select id="com-observador" class="field-select"></select>
      </div>
      <div class="mt-4 bg-vdw-orange/10 border border-vdw-orange/20 rounded-xl px-4 py-2.5 text-center text-white/90 text-sm font-medium" id="combo-summary">
        0 piloto(s) × 0 drone(s) = 0 PDF(s)
      </div>
      <button class="btn-primary w-full mt-3 py-2.5 text-sm" id="btnGenerarMain">Generar PDF</button>
    </div>

  </section>

  <!-- ============ Personas ============ -->
  <section class="app-section hidden" id="section-personas">
    <div class="flex justify-between items-center mb-4">
      <h4 class="text-2xl font-bold text-white">Personas</h4>
      <button class="btn-primary text-sm" id="btnAddPersona">+ Añadir persona</button>
    </div>
    <div id="personas-list" class="accordion-container"></div>
  </section>

  <!-- ============ Drones ============ -->
  <section class="app-section hidden" id="section-drones">
    <div class="flex justify-between items-center mb-4">
      <h4 class="text-2xl font-bold text-white">Drones (UAS)</h4>
      <button class="btn-primary text-sm" id="btnAddDrone">+ Añadir dron</button>
    </div>
    <div id="drones-list" class="accordion-container"></div>
  </section>

  <!-- ============ Operaciones ============ -->
  <section class="app-section hidden" id="section-operaciones">
    <div class="flex justify-between items-center mb-4">
      <h4 class="text-2xl font-bold text-white">Operaciones</h4>
      <button class="btn-primary text-sm" id="btnAddOperacion">+ Añadir operación</button>
    </div>
    <div id="operaciones-list" class="accordion-container"></div>
  </section>

</main>

<!-- Toast -->
<div id="toast" class="toast-wrapper">
  <div class="toast-inner">
    <span id="toast-body"></span>
    <button id="toast-close" class="text-white/50 hover:text-white ml-3 text-lg leading-none">&times;</button>
  </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
