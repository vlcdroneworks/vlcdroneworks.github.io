# Al inyectar la versión hace commit con [skip ci] para no volver a disparar el workflow.
name: Inject version with commit SHA

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract base version and inject version
        id: inject
        run: |
          VERSION_FILE="comunicacion/version.txt"
          HTML_FILE="comunicacion/index.html"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "No se encontró $VERSION_FILE"
            exit 1
          fi
          BASE=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$VERSION_FILE" | head -1)
          if [ -z "$BASE" ]; then
            echo "Versión base no válida en $VERSION_FILE (esperado X.Y.Z)"
            exit 1
          fi
          NEW_V="${BASE}+${{ steps.sha.outputs.short_sha }}"
          echo "new_version=$NEW_V" >> $GITHUB_OUTPUT
          sed -i "s/var V = '[^']*'/var V = '$NEW_V'/" "$HTML_FILE"
          echo "Versión inyectada: $NEW_V"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comunicacion/index.html comunicacion/version.txt
          if git diff --staged --quiet; then
            echo "Sin cambios (la versión ya coincidía con este commit)"
            exit 0
          fi
          git commit -m "chore: set app version to ${{ steps.inject.outputs.new_version }} [skip ci]"
          git push
