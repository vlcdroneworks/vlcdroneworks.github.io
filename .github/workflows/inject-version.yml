# Al inyectar la versión hace commit con [skip ci] para no volver a disparar el workflow.
name: Inject version with commit SHA

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Extract base version and inject version
        id: inject
        run: |
          FILE="comunicacion/index.html"
          # Extraer solo la parte semántica (ej. 2.0.0 de '2.0.0' o '2.0.0+abc1234')
          BASE=$(sed -n "s/.*var V = '\([0-9.]*\).*/\1/p" "$FILE")
          if [ -z "$BASE" ]; then
            echo "No se encontró var V = 'X.Y.Z' en $FILE"
            exit 1
          fi
          NEW_V="${BASE}+${{ steps.sha.outputs.short_sha }}"
          echo "new_version=$NEW_V" >> $GITHUB_OUTPUT
          # Reemplazar cualquier valor actual de V por el nuevo
          sed -i "s/var V = '[^']*'/var V = '$NEW_V'/" "$FILE"
          echo "Versión inyectada: $NEW_V"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add comunicacion/index.html
          if git diff --staged --quiet; then
            echo "Sin cambios (la versión ya coincidía con este commit)"
            exit 0
          fi
          git commit -m "chore: set app version to ${{ steps.inject.outputs.new_version }} [skip ci]"
          git push
